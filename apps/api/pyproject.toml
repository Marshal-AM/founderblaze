[project]
name = "founderblaze-api"
version = "0.1.0"
description = "FounderBlaze FastAPI A2MCP gateway"
requires-python = ">=3.11"
dependencies = [
  "founderblaze",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "temporalio>=1.11",
]

[project.scripts]
founderblaze-api = "founderblaze_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/founderblaze_api"]

[tool.hatch.build.targets.wheel.sources]
"src/founderblaze_api" = "founderblaze_api"

[tool.uv.sources]
founderblaze = { workspace = true }
