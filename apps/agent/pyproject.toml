[project]
name = "founderblaze-agent"
version = "0.1.0"
description = "FounderBlaze agent FastAPI (Postman + chat UI backend) and MCP HTTP"
requires-python = ">=3.11"
dependencies = [
  "founderblaze",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
]

[project.scripts]
founderblaze-agent = "founderblaze_agent.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/founderblaze_agent"]

[tool.hatch.build.targets.wheel.sources]
"src/founderblaze_agent" = "founderblaze_agent"

[tool.uv.sources]
founderblaze = { workspace = true }
