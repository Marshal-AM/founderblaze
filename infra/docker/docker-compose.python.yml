# FounderBlaze Python stack dependencies (Postgres + Temporal).
# Postgres on 5433 to avoid clashes with other local DBs on 5432.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: founderblaze
      POSTGRES_PASSWORD: founderblaze
      POSTGRES_DB: founderblaze
    ports:
      - "5433:5432"
    volumes:
      - founderblaze_pgdata:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      - postgres
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=founderblaze
      - POSTGRES_PWD=founderblaze
      - POSTGRES_SEEDS=postgres
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8088:8080"

volumes:
  founderblaze_pgdata:
